<div class="mt-20 border-y border-white/10 bg-white/[0.04]">
  <div class="content grid grid-cols-1 gap-10 py-12 sm:grid-cols-2 lg:grid-cols-4">
    @for (feature of features; track feature.title) {
      <div class="flex items-start gap-4">
        <app-icon [name]="feature.icon" iconClass="h-7 w-7 shrink-0 text-brand-purple" />
        <div>
          <p class="text-xs font-bold uppercase tracking-widest text-white">{{ feature.title }}</p>
          <p class="mt-2 text-sm text-gray-400">{{ feature.description }}</p>
        </div>
      </div>
    }
  </div>
</div>
