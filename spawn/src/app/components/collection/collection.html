<section id="collection" class="snap-section relative flex min-h-screen items-center overflow-hidden py-12">
  <div class="pointer-events-none absolute -right-40 top-0 h-[36rem] w-[36rem] rounded-full bg-brand-purple/10 blur-[160px]"></div>

  <div class="content relative">
    <div class="mb-10 flex flex-wrap items-end justify-between gap-4 w-100">
      <div>
        <p class="text-sm font-semibold uppercase tracking-widest text-brand-purple">Our Collection</p>
        <h1 class="mt-2 text-4xl font-black uppercase leading-tight tracking-tight text-white lg:text-5xl">Tools for Every Playstyle</h1>
      </div>
    </div>

    <div class="grid grid-cols-1 gap-8 lg:grid-cols-2">
      @for (product of products; track product.name) {
        <div class="group relative min-h-[380px] overflow-hidden rounded-lg border border-white/10 bg-white/[0.02] p-10 lg:min-h-[460px] lg:p-12">
          <div class="flex items-center gap-3 text-brand-purple">
            <span class="text-base font-bold">{{ product.index }}</span>
            <span class="h-px w-10 bg-brand-purple/50"></span>
          </div>

          <h3 class="mt-6 text-4xl font-bold uppercase leading-none tracking-tight text-white lg:text-5xl">{{ product.name }}</h3>
          <p class="mt-4 whitespace-pre-line text-base text-gray-400">{{ product.description }}</p>

          <a
            [href]="product.url"
            target="_blank"
            rel="noopener noreferrer"
            class="mt-10 inline-flex items-center gap-2 rounded border border-white/20 px-6 py-3 text-sm font-bold uppercase tracking-widest text-white transition-colors hover:border-white/40"
          >
            View Product
            <app-icon name="arrow-right" iconClass="h-4 w-4" />
          </a>

          <img
            [src]="product.image"
            [alt]="product.name"
            class="pointer-events-none absolute bottom-0 right-0 w-3/5 max-w-[380px] translate-x-6 translate-y-6 transition-transform duration-300 group-hover:translate-x-3"
          />
        </div>
      }
    </div>
  </div>

  <app-scroll-hint />
</section>
