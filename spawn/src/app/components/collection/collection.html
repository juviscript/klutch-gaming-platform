<section id="collection" class="snap-section flex min-h-screen items-center py-24">
  <div class="content">
    <div class="mb-10 flex flex-wrap items-end justify-between gap-4">
      <div>
        <p class="text-xs font-semibold uppercase tracking-widest text-brand-purple">Our Collection</p>
        <h2 class="mt-2 text-3xl font-black uppercase tracking-tight text-white sm:text-4xl">Tools for Every Playstyle</h2>
      </div>
      <a
        href="#"
        class="inline-flex items-center gap-2 text-xs font-semibold uppercase tracking-widest text-gray-400 transition-colors hover:text-white"
      >
        View All Products
        <app-icon name="arrow-right" iconClass="h-4 w-4" />
      </a>
    </div>

    <div class="grid grid-cols-1 gap-6 lg:grid-cols-2">
      @for (product of products; track product.name) {
        <div class="group relative overflow-hidden rounded-lg border border-white/10 bg-white/[0.02] p-8">
          <div class="flex items-center gap-3 text-brand-purple">
            <span class="text-sm font-bold">{{ product.index }}</span>
            <span class="h-px w-8 bg-brand-purple/50"></span>
          </div>

          <h3 class="mt-4 text-3xl font-black uppercase leading-none tracking-tight text-white">{{ product.name }}</h3>
          <p class="mt-4 whitespace-pre-line text-sm text-gray-400">{{ product.description }}</p>

          <a
            href="#"
            class="mt-8 inline-flex items-center gap-2 rounded border border-white/20 px-5 py-2.5 text-xs font-bold uppercase tracking-widest text-white transition-colors hover:border-white/40"
          >
            View Product
            <app-icon name="arrow-right" iconClass="h-4 w-4" />
          </a>

          <img
            [src]="product.image"
            [alt]="product.name"
            class="pointer-events-none absolute bottom-0 right-0 w-1/2 max-w-[220px] translate-x-4 translate-y-4 opacity-90 transition-transform duration-300 group-hover:translate-x-2"
          />
        </div>
      }
    </div>
  </div>
</section>
